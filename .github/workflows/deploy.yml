name: Build & Deploy Lambda
run-name: >-
  ${{
    github.event_name == 'pull_request' && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) ||
    github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy' && format('🗑️ Destroy: {0}', github.event.inputs.environment) ||
    github.event_name == 'workflow_dispatch' && format('Manual: {0}', github.event.inputs.environment) ||
    format('Deploy: {0}', github.ref_name)
  }}

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ TEMPLATE MODE: Triggers are commented out to prevent automatic runs.       │
# │ After setup, uncomment the triggers below to enable CI/CD.                 │
# │ See README.md "Step 5: Enable CI/CD Workflows" for instructions.           │
# └─────────────────────────────────────────────────────────────────────────────┘
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        options: [dev, qa, prod]
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options: [deploy, destroy]
        default: deploy
      skip_tests:
        description: 'Skip tests (only for deploy)'
        required: false
        type: boolean
        default: false
  # ─────────────────────────────────────────────────────────────────────────────
  # UNCOMMENT BELOW TO ENABLE AUTOMATIC DEPLOYMENTS
  # ─────────────────────────────────────────────────────────────────────────────
  # push:
  #   branches: [main, develop, "feature/*", "release/*"]
  #   paths:
  #     - 'src/**'
  #     - 'tests/**'
  #     - 'Dockerfile'
  #     - 'pyproject.toml'
  #     - 'poetry.lock'
  #     - 'terraform/**'
  #     - '.github/workflows/deploy.yml'
  # pull_request:
  #   branches: [main, develop]
  #   paths:
  #     - 'src/**'
  #     - 'tests/**'
  #     - 'Dockerfile'
  #     - 'pyproject.toml'
  #     - 'terraform/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  AWS_REGION: eu-west-1
  TF_VERSION: '1.10.0'
  PYTHON_VERSION: '3.12'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Detect Environment
  # ─────────────────────────────────────────────────────────────────────────────
  detect:
    name: Detect Environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      env_upper: ${{ steps.env.outputs.env_upper }}
      image_tag: ${{ steps.env.outputs.image_tag }}
    steps:
      - name: Detect Environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="prod"
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            ENV="qa"
          else
            ENV="dev"
          fi
          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          echo "env_upper=$(echo ${ENV} | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT
          echo "image_tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────────────────────
  # Test
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: detect
    if: github.event.inputs.action != 'destroy' && github.event.inputs.skip_tests != 'true'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev

      - name: Lint
        run: poetry run ruff check src tests

      - name: Type check
        run: poetry run mypy src

      - name: Test with coverage
        run: poetry run pytest --cov=src --cov-report=xml --cov-fail-under=80

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Build & Push Docker Image
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: [detect, test]
    if: github.event.inputs.action != 'destroy' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
    env:
      ENV: ${{ needs.detect.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_ARN_{0}', needs.detect.outputs.env_upper)] }}
          role-session-name: lambda-build-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Read Config
        id: config
        run: |
          # Extract values from terraform/config.tf
          FUNCTION_NAME=$(grep 'function_name\s*=' terraform/config.tf | head -1 | sed 's/.*"\(.*\)".*/\1/')
          COMPANY_NAME=$(grep 'company_name\s*=' terraform/config.tf | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "function_name=${FUNCTION_NAME}" >> $GITHUB_OUTPUT
          echo "company_name=${COMPANY_NAME}" >> $GITHUB_OUTPUT

      - name: Create ECR Repository
        id: ecr
        run: |
          REPO_NAME="${{ steps.config.outputs.function_name }}-${{ env.ENV }}"
          REPO_URI="${{ steps.ecr-login.outputs.registry }}/${REPO_NAME}"
          
          # Create ECR repository if it doesn't exist
          aws ecr describe-repositories --repository-names "${REPO_NAME}" 2>/dev/null || \
          aws ecr create-repository \
            --repository-name "${REPO_NAME}" \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256 \
            --tags Key=Environment,Value=${{ env.ENV }} Key=Project,Value=${{ steps.config.outputs.function_name }}
          
          echo "repo_name=${REPO_NAME}" >> $GITHUB_OUTPUT
          echo "repo_uri=${REPO_URI}" >> $GITHUB_OUTPUT

      - name: Build and Push
        id: build
        run: |
          IMAGE_TAG="${{ needs.detect.outputs.image_tag }}"
          IMAGE_URI="${{ steps.ecr.outputs.repo_uri }}:${IMAGE_TAG}"
          
          docker build -t ${IMAGE_URI} .
          docker push ${IMAGE_URI}
          
          # Also tag as latest
          docker tag ${IMAGE_URI} ${{ steps.ecr.outputs.repo_uri }}:latest
          docker push ${{ steps.ecr.outputs.repo_uri }}:latest
          
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "function_name=${{ steps.config.outputs.function_name }}" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy Infrastructure
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [detect, build]
    if: github.event.inputs.action != 'destroy' && github.event_name != 'pull_request'
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    env:
      ENV: ${{ needs.detect.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_ARN_{0}', needs.detect.outputs.env_upper)] }}
          role-session-name: lambda-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Account ID
        id: aws
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Read Config
        id: config
        run: |
          # Extract values from terraform/config.tf
          FUNCTION_NAME=$(grep 'function_name\s*=' terraform/config.tf | head -1 | sed 's/.*"\(.*\)".*/\1/')
          COMPANY_NAME=$(grep 'company_name\s*=' terraform/config.tf | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "function_name=${FUNCTION_NAME}" >> $GITHUB_OUTPUT
          echo "company_name=${COMPANY_NAME}" >> $GITHUB_OUTPUT

      - name: Terraform Init
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=tfstate-${{ steps.config.outputs.company_name }}-${{ env.ENV }}-${{ steps.aws.outputs.account_id }}" \
            -backend-config="key=lambda/${{ steps.config.outputs.function_name }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"
        working-directory: ./terraform

      - name: Terraform Plan
        run: |
          terraform plan -out=tfplan -input=false \
            -var="environment=${{ env.ENV }}" \
            -var="image_tag=${{ needs.detect.outputs.image_tag }}"
        working-directory: ./terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false tfplan
        working-directory: ./terraform

      - name: Summary
        run: |
          echo "### ✅ Lambda Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- **Function:** ${{ steps.config.outputs.function_name }}-${{ env.ENV }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** ${{ needs.build.outputs.image_uri }}" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────────
  # Destroy Infrastructure
  # ─────────────────────────────────────────────────────────────────────────────
  destroy:
    name: Destroy
    runs-on: ubuntu-latest
    needs: [detect]
    if: github.event.inputs.action == 'destroy'
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    env:
      ENV: ${{ needs.detect.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_ARN_{0}', needs.detect.outputs.env_upper)] }}
          role-session-name: lambda-destroy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Account ID
        id: aws
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Read Config
        id: config
        run: |
          FUNCTION_NAME=$(grep 'function_name\s*=' terraform/config.tf | head -1 | sed 's/.*"\(.*\)".*/\1/')
          COMPANY_NAME=$(grep 'company_name\s*=' terraform/config.tf | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "function_name=${FUNCTION_NAME}" >> $GITHUB_OUTPUT
          echo "company_name=${COMPANY_NAME}" >> $GITHUB_OUTPUT

      - name: Terraform Init
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=tfstate-${{ steps.config.outputs.company_name }}-${{ env.ENV }}-${{ steps.aws.outputs.account_id }}" \
            -backend-config="key=lambda/${{ steps.config.outputs.function_name }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"
        working-directory: ./terraform

      - name: Terraform Destroy
        run: |
          terraform destroy -auto-approve -input=false \
            -var="environment=${{ env.ENV }}" \
            -var="image_tag=destroy"
        working-directory: ./terraform

      - name: Delete ECR Repository
        run: |
          REPO_NAME="${{ steps.config.outputs.function_name }}-${{ env.ENV }}"
          aws ecr delete-repository --repository-name "${REPO_NAME}" --force || true
        continue-on-error: true

      - name: Summary
        run: |
          echo "### 🗑️ Infrastructure Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ env.ENV }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Function:** ${{ steps.config.outputs.function_name }}-${{ env.ENV }}" >> $GITHUB_STEP_SUMMARY
